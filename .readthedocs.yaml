# Read the Docs build configuration of the Streamhub documentation.
# This file is not at the repository root: in the project's settings on readthedocs.org, set
# "Build configuration file" (Advanced settings) to readthedocs/.readthedocs.yaml.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: readthedocs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: readthedocs/requirements.txt
    # The package itself, so the CLI reference is generated from streamhub.cli.
    - method: pip
      path: .

formats:
  - pdf
  - epub
