# Two Streamhub instances behind HAProxy. HAProxy inserts its own SERVERID cookie, so it does not need
# the hub's streamhub_instance cookie. Start each hub with its own STREAMHUB_INSTANCE_ID and
# "behind-proxy": true.

defaults
    mode http
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h          # Streamlit keeps a WebSocket open

frontend streamhub
    bind :80
    default_backend hubs

backend hubs
    balance roundrobin
    cookie SERVERID insert indirect nocache httponly
    option forwardfor
    option httpchk GET /api/health
    server hub-a 10.0.0.11:8500 check cookie hub-a
    server hub-b 10.0.0.12:8500 check cookie hub-b
