# Two Streamhub instances behind nginx (open source). Each hub sets the streamhub_instance cookie to its
# instance-id; nginx sends a browser that has the cookie back to the same hub, so its running apps and
# WebSockets stay on one instance. Start each hub with STREAMHUB_INSTANCE_ID and "behind-proxy": true.

map $cookie_streamhub_instance $streamhub_backend {
    hub-a   10.0.0.11:8500;
    hub-b   10.0.0.12:8500;
    default streamhub_new;   # no cookie yet: pick one
}

upstream streamhub_new {
    hash $remote_addr consistent;
    server 10.0.0.11:8500;
    server 10.0.0.12:8500;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    client_max_body_size 1g;

    location / {
        proxy_pass http://$streamhub_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;    # Streamlit keeps a WebSocket open
        proxy_buffering off;
    }
}
