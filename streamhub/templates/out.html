<!DOCTYPE html>
<html lang="en">
<head>
	<title>{{ site_title }} · {{ appid }} output</title>
	{% include "_head.html" %}
</head>
<body class="sh-body sh-layout-top">
{% include "_nav.html" %}
<main class="sh-main">
	<div class="sh-page-head">
		<div>
			<p class="sh-eyebrow">App output</p>
			<h1 class="sh-page-title">{{ appid }}</h1>
			<p class="sh-page-sub">stdout and stderr, last 256 KB</p>
		</div>
		<div class="sh-page-actions">
			<a class="btn btn-sm sh-btn-quiet" href="/{{ appid }}/"><i class="fa fa-external-link"></i> Open app</a>
			<a class="btn btn-sm sh-btn-primary" href=""><i class="fa fa-refresh"></i> Refresh</a>
		</div>
	</div>
	{% if output %}
	<pre class="log-output sh-log-tall">{{ output }}</pre>
	{% else %}
	<div class="sh-empty" style="display: block;"><i class="fa fa-terminal"></i> No output yet.</div>
	{% end %}
</main>
{% include "_footer.html" %}
{% include "_ux.html" %}
</body>
</html>
